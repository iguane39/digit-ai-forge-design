<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixture verte — oracle-mobile</title>
<!-- provenance : chantier forge-design, 04/08/2026. M1-M6 sans écart. -->
<style>
  .btn { min-height: 44px; min-width: 44px; padding: 12px 16px; }
  a.lien { min-height: 44px; display: inline-flex; align-items: center; }

  .barre-basse {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }

  .ecran { min-height: 100dvh; }

  .carte { transition: transform .28s cubic-bezier(.16, 1, .3, 1); }

  /* reflow des tables en cartes sous 768 px */
  @media (max-width: 768px) {
    table, thead, tbody, tr, td, th { display: block; }
    thead { position: absolute; left: -9999px; }
    tr { border-bottom: 1px solid; margin-bottom: 12px; }
    td::before { content: attr(data-libelle); font-weight: 600; }
  }

  /* orientation paysage traitée */
  @media (orientation: landscape) and (max-height: 480px) {
    .barre-basse { position: static; }
    .ecran { min-height: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="ecran">
    <button class="btn">Filtrer</button>
    <a class="lien" href="#detail">Détail</a>

    <table>
      <thead><tr><th>Dossier</th><th>Ouvert le</th><th>Statut</th></tr></thead>
      <tbody>
        <tr><td data-libelle="Dossier">D-1042</td><td data-libelle="Ouvert le">02/07/2026</td><td data-libelle="Statut">En cours</td></tr>
        <tr><td data-libelle="Dossier">D-1043</td><td data-libelle="Ouvert le">03/07/2026</td><td data-libelle="Statut">Clos</td></tr>
      </tbody>
    </table>
  </div>
  <nav class="barre-basse">Accueil · Dossiers · Profil</nav>
</body>
</html>
