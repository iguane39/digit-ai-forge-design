<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fixture verte — oracle-slop</title>
<!-- provenance : chantier forge-design, 04/08/2026. Aucune règle S1-S10 ne doit se déclencher. -->
<style>
  :root {
    --encre: #171a21;
    --papier: #f3f1ec;
    --surface: #e9e5dc;
    --trait: #cfc9bd;
    --signal: #8a4b2a;
  }
  body {
    font-family: "Source Serif 4", Georgia, serif;
    background: var(--papier);
    color: var(--encre);
    margin: 0;
  }
  h1, h2, h3 { font-family: "Bricolage Grotesque", "Trebuchet MS", sans-serif; }

  /* filet d'une largeur de trait : autorisé */
  .alerte { border-left: 1px solid var(--trait); padding: 12px 16px; background: var(--surface); }

  /* rayons variés, pas de rectangle arrondi générique */
  .carte { border-radius: 10px; }
  .champ { border-radius: 4px; }
  .bouton { border-radius: 2px; }

  /* décélération exponentielle, sans dépassement */
  .carte { transition: transform .28s cubic-bezier(.16, 1, .3, 1); }
</style>
</head>
<body>
  <h1>Tableau de bord</h1>
  <p>Bienvenue sur votre espace. <span class="signal">Trois traitements</span> sont en cours.</p>

  <div class="alerte">Quota bientôt atteint.</div>

  <!-- trois blocs de même classe mais sans icône : ce n'est pas une grille templatée -->
  <section class="liste">
    <div class="ligne"><h3>Rapide</h3><p>Traitement immédiat.</p></div>
    <div class="ligne"><h3>Fiable</h3><p>Disponibilité tenue.</p></div>
    <div class="ligne"><h3>Ouvert</h3><p>Interfaces documentées.</p></div>
  </section>

  <!-- graphique légendé : ce n'est pas de la décoration -->
  <figure>
    <svg viewBox="0 0 320 140" role="img" aria-labelledby="t-vol">
      <title id="t-vol">Volume traité par semaine, 7 dernières semaines</title>
      <polyline points="0,110 50,92 100,98 150,64 200,72 250,40 300,48" fill="none" stroke="var(--signal)"/>
      <text x="0" y="132">S1</text>
      <text x="286" y="132">S7</text>
    </svg>
    <figcaption>Volume traité par semaine.</figcaption>
  </figure>
</body>
</html>
