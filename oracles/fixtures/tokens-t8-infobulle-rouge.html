<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fixture ROUGE — oracle-tokens T8, surface d'infobulle interactive confrontée à l'anneau</title>
<!--
  TF-1662 (retour du 13/10/2026). Même document que la verte jumelle, sans la
  déclaration « pointer-events: none » de .infobulle : la surface reçoit le
  pointeur, elle peut porter un lien ou un bouton, et rien dans le CSS ne dit le
  contraire. L'écart par structure ne s'applique donc pas : --focus-anneau
  (#2563EB) y reste confronté à --tt-bg (2.83:1) et --tt-code-bg (2.00:1).

  Attendu : FAIL, exit 1, sur T8 (deux constats majeurs).
-->
<style>
  :root {
    --fond: #ffffff;
    --fond-carte: #eef1f6;
    --texte: #1b1f26;
    --focus-anneau: #2563EB;
    --focus-decalage: 2px;
    --tt-bg: #1e293b;
    --tt-code-bg: #334155;
    --tt-texte: #f8fafc;
    --police-corps: "Source Serif 4", Georgia, serif;
  }
  body { background: var(--fond); color: var(--texte); font-family: var(--police-corps); margin: 0; padding: 32px; }
  .carte { background: var(--fond-carte); color: var(--texte); padding: 16px; }
  .bouton:focus-visible { outline: 3px solid var(--focus-anneau); outline-offset: var(--focus-decalage); }
  .infobulle { position: absolute; background: var(--tt-bg); color: var(--tt-texte); padding: 8px; }
  .infobulle code { background: var(--tt-code-bg); color: var(--tt-texte); }
</style>
</head>
<body>
  <h1>Réglages du rapport</h1>
  <div class="carte">
    <button class="bouton" type="button" aria-describedby="aide">Exporter</button>
    <div class="infobulle" id="aide" role="tooltip">Exporte au format <code>csv</code></div>
  </div>
</body>
</html>
