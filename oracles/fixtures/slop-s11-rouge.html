<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>S11 rouge — halos colorés</title>
<style>
  :root { --fond: #f6f4ef; --texte: #23211c; }
  body { background: var(--fond); color: var(--texte); margin: 0; padding: 24px; }
  .badge { padding: 4px 8px; border-radius: 8px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
  .titre { text-shadow: 0 0 16px rgba(34, 211, 238, 0.6); }
  .logo { filter: drop-shadow(0 0 14px rgba(236, 72, 153, 0.7)); }
</style>
</head>
<body>
  <h1 class="titre">Tableau de bord</h1>
  <span class="badge">Pro</span>
  <img class="logo" src="logo.svg" alt="Logo" width="32" height="32">
  <span class="shadow-[0_0_20px_rgba(139,92,246,0.5)]">Nouveau</span>
</body>
</html>
