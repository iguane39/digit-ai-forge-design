<!DOCTYPE html>
<!-- FIXTURE ROUGE — oracle-erreurs-formulaire (TF-2172, lot Produit-86 du 05/11/2026).
     Le défaut tel que le porteur l'a vu : le même formulaire que la verte, mais une saisie refusée s'affiche en bandeau
     EN TÊTE DE PAGE, loin du formulaire, avec un code technique en titre (« Refusé : CIBLE_INVALIDE »), seulement à
     l'envoi, sans champ désigné : ni aria-invalid, ni message relié. Attendu : FAIL, exit 1, EF1 bloquant sur chaque
     champ, le texte du bandeau cité. -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fixture oracle-erreurs-formulaire (rouge, bandeau en tête de page)</title>
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 16px; line-height: 24px; }
    .bandeau { padding: 12px 24px; background: #fde8e8; color: #7a1010; }
    main { max-width: 640px; padding: 24px; }
    .espace { height: 480px; }
    .champ { margin: 0 0 16px; }
    label { display: block; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 8px; font: inherit; }
  </style>
</head>
<body>
<div class="bandeau" role="alert" id="bandeau" hidden></div>
<main>
  <h1>Ajouter un client</h1>
  <div class="espace"><p>Renseignez le domaine puis le courriel du contact.</p></div>
  <form id="f" action="http://127.0.0.1:9/clients" method="post" novalidate>
    <div class="champ">
      <label for="domaine">Domaine du client</label>
      <input id="domaine" name="domaine" type="text" required pattern="[a-z0-9]+(\.[a-z0-9]+)+" data-valeur-fausse="costcontrol">
    </div>
    <div class="champ">
      <label for="courriel">Courriel du contact</label>
      <input id="courriel" name="courriel" type="email" required>
    </div>
    <button type="submit">Enregistrer le client</button>
  </form>
</main>
<script>
  // Le refus n'est dit qu'à l'envoi, en bandeau, avec le code du serveur : aucun champ désigné, aucune forme attendue.
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var b = document.getElementById('bandeau');
    b.textContent = 'Refusé : CIBLE_INVALIDE';
    b.hidden = false;
  });
</script>
</body>
</html>
