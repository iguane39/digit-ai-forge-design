<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<title>Fixture verte — la page dediee, troisieme motif legitime de creation</title>
<!-- TF-0925 (08/09/2026). Le TROISIEME motif de creation, celui que cet oracle n'admettait pas
     et que le pan interface de forge-tests admet depuis le 08/09 : la page EST le formulaire.
     Rien a replier, rien a adresser — l'adresse, c'est la page.

     Le critere est mecanique et etroit : l'affordance qui ANNONCE la creation
     (« Creer mon compte », trois mots, verbe en tete) est le controle qui SOUMET le
     formulaire de l'ecran. Elle est DEDANS, elle l'envoie. C'est exactement ce qui separe
     cette page de la fixture rouge, ou l'affordance de creation est HORS du formulaire.

     Tant que les deux forges n'enumeraient pas les memes motifs, un produit a page dediee
     etait refuse par l'une ou par l'autre quoi qu'il fasse. -->
<style>
  :root { --fond: #ffffff; --texte: #16181d; --trait: #d7d9de; }
  body { font-family: system-ui, sans-serif; background: var(--fond); color: var(--texte); margin: 0; padding: 32px; }
  form { max-width: 32rem; }
  label { display: block; margin-top: 16px; }
  input { width: 100%; padding: 8px; border: 1px solid var(--trait); }
  button { margin-top: 24px; padding: 8px 16px; border: 1px solid var(--trait); background: var(--fond); color: var(--texte); }
</style>
</head>
<body>

<section id="compte-nouveau" data-ecran="compte-nouveau">
  <h1>Ouvrir un compte</h1>
  <p>Cette page ne fait que cela : elle porte le formulaire, et rien d'autre. Aucune liste ne
     l'accompagne, donc aucun repli a poser et aucune route a inventer.</p>

  <form action="/comptes" method="post">
    <label for="raison-sociale">Raison sociale</label>
    <input type="text" id="raison-sociale" name="raison_sociale" required>

    <label for="courriel">Adresse de courriel</label>
    <input type="email" id="courriel" name="courriel" required>

    <label for="mot-de-passe">Mot de passe</label>
    <input type="password" id="mot-de-passe" name="mot_de_passe" required>

    <button type="submit">Creer mon compte</button>
  </form>
</section>

</body>
</html>
