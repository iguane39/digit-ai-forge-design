<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture rouge — oracle-surcouche SC5 (défilement qui se prolonge)</title>
<!--
  TF-1911, règle SC5 (avertissement), sens rouge : le tiroir est habillé de bout en bout
  (SC1 à SC4 muettes) et son conteneur défile, mais aucun overscroll-behavior ne le contient :
  le défilement se prolonge dans la page derrière lui. SC5 est un avertissement : la page
  reste PASS, exit 0.
-->
<style>
  :root { color-scheme: light; --fond: #fbf9f5; --fond-eleve: #f2eee6; --texte: #1d2126; --trait: #d8d2c6; --voile: rgba(29, 33, 38, 0.55); --ombre: rgba(29, 33, 38, 0.18); }
  body { background: var(--fond); color: var(--texte); margin: 0; padding: 32px; }
  .tiroir { background: var(--fond-eleve); color: var(--texte); box-shadow: 0 -8px 24px var(--ombre); padding: 24px; }
  .tiroir::backdrop { background: var(--voile); }
  .tiroir-corps { max-height: 240px; overflow-y: auto; }
  .tiroir-btn { background: var(--fond); color: var(--texte); border: 1px solid var(--trait); padding: 8px 16px; }
</style>
</head>
<body>
  <h1>Tiroir qui laisse fuir le défilement</h1>
  <dialog class="tiroir" aria-labelledby="t-titre">
    <h2 id="t-titre">Historique</h2>
    <div class="tiroir-corps"><p>Ligne 1</p><p>Ligne 2</p><p>Ligne 3</p></div>
    <button class="tiroir-btn" type="button">Fermer</button>
  </dialog>
</body>
</html>
