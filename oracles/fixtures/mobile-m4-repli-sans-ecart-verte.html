  ce n'est pas un écart. Sur une page qui ne porte rien d'autre — orientation paysage prévue (M5), couleur de barre déclarée (M11), aucun

  Attendu : PASS, exit 0 — M4 en info, puis « M1–M11 sans écart ».
-->
