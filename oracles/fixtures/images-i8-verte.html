<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture verte — oracle-images I8 (dimensions posées)</title>
<!--
  TF-1911, règle I8 (avertissement), sens vert. Règle tirée des Web Interface Guidelines de
  Vercel (l.80) et d'UI/UX Pro Max (n° 19), MIT, figées au 19/10/2026 ; attribution :
  regles-importees-vercel-emil.md. Les deux images portent width ET height : I8 muette.
  Images relatives, non embarquées : aucun manifeste exigé.
-->
<style>
  :root { color-scheme: light; --fond: #fbf9f5; --texte: #1d2126; }
  body { background: var(--fond); color: var(--texte); margin: 0; padding: 32px; }
  img { max-width: 100%; height: auto; }
</style>
</head>
<body>
  <h1>Images à dimensions posées</h1>
  <img src="chantier.jpg" alt="Façade du chantier de la rue Haute" width="640" height="360">
  <img src="plan.jpg" alt="Plan du rez-de-chaussée" width="320" height="240">
</body>
</html>
