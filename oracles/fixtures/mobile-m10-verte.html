<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf9f5">
<title>Fixture verte — oracle-mobile M10 (tap maîtrisé)</title>
<!--
  TF-1911, règle M10 (avertissement), sens vert. Règle tirée des Web Interface Guidelines de
  Vercel (l.104-105) et de mobile-native d'Emil Kowalski (§2 et §5), MIT, figées au 19/10/2026 ;
  attribution : regles-importees-vercel-emil.md. La page pose touch-action: manipulation et
  la couleur d'éclair du tap : M10 reste muette. theme-color présent, M11 aussi.
-->
<style>
  :root { color-scheme: light; --fond: #fbf9f5; --texte: #1d2126; --trait: #d8d2c6; }
  body { background: var(--fond); color: var(--texte); margin: 0; padding: 32px; -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; min-height: 44px; min-width: 44px; background: var(--fond); color: var(--texte); border: 1px solid var(--trait); }
  @media (orientation: landscape) { body { padding: 16px; } }
</style>
</head>
<body>
  <h1>Tap maîtrisé</h1>
  <button type="button">Valider</button>
</body>
</html>
