<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fixture verte — oracle-tokens T8, surface de badge déclarée hors champ du focus</title>
<!--
  TF-1058 (mesuré le 11/09 sur Produit-62, RD-17). Même document que la fixture
  rouge jumelle (--focus-anneau contre --badge-muted-bg à 1.45:1 < 3:1), mais la
  feuille déclare ici --surfaces-hors-focus: --badge-muted-bg — même mécanique
  déclarative que --paires-contraste / --paires-interface (T5/T7) : le rôle
  d'une surface (conteneur focusable ou remplissage décoratif) n'est pas
  décidable depuis le CSS seul, l'auteur le déclare. L'exemption n'est PAS un
  renommage : le nom du jeton ne change pas, seule sa déclaration hors champ
  change le verdict.

  Attendu : PASS, exit 0 — --focus-anneau tient ≥ 3:1 contre les VRAIES
  surfaces (--fond, --fond-carte, deux thèmes), --badge-muted-bg est écarté.
-->
<style>
  :root {
    --fond: #ffffff;
    --fond-carte: #eef1f6;
    --texte: #1b1f26;
    --focus-anneau: #3B82F6;
    --focus-decalage: 2px;
    --badge-muted-bg: #9CA3AF;
    --texte-sur-badge: #111827;
    --surfaces-hors-focus: --badge-muted-bg;
    --police-corps: "Source Serif 4", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #12151b;
      --fond-carte: #1c2029;
      --texte: #eef1f6;
      --focus-anneau: #3B82F6;
      --focus-decalage: 2px;
      --badge-muted-bg: #9CA3AF;
      --texte-sur-badge: #111827;
      --surfaces-hors-focus: --badge-muted-bg;
    }
  }
  body { background: var(--fond); color: var(--texte); font-family: var(--police-corps); margin: 0; padding: 32px; }
  .carte { background: var(--fond-carte); color: var(--texte); padding: 16px; }
  .pastille { display: inline-block; height: 20px; line-height: 20px; padding: 0 8px; border-radius: 10px; background: var(--badge-muted-bg); color: var(--texte-sur-badge); }
  .bouton:focus-visible { outline: 3px solid var(--focus-anneau); outline-offset: var(--focus-decalage); }
</style>
</head>
<body>
  <h1>Suivi des statuts</h1>
  <div class="carte">
    <span class="pastille">En pause</span>
    <button class="bouton" type="submit">Relancer</button>
  </div>
</body>
</html>
