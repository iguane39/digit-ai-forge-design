<!DOCTYPE html>
<!-- FIXTURE ROUGE — oracle-bascule, règle B-T3 seule.
     Différence UNIQUE avec bascule-verte.html : aucune trace de localStorage nulle
     part dans le document (ni lecture, ni écriture d'une clé « theme »). Le bouton
     est présent en en-tête, câblé, et mute bien data-theme sur la racine au clic :
     B-T1, B-T2 et B-T4 restent verts. Seule la persistance manque. -->
<html lang="fr">
<head>
<script>
(function () {
  var theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
  <meta charset="UTF-8">
  <title>Digit-AI — Fixture oracle-bascule (rouge, B-T3 — sans persistance)</title>
  <style>
    :root {
      --bg: #FAFBFF; --ink: #0F172A; --muted: #64748B; --surface: #FFFFFF; --line: #E6EAF2;
    }
    :root[data-theme="dark"] {
      --bg: #0B1220; --ink: #EEF2F8; --muted: #A9B4C4; --surface: #121B2E; --line: #263248;
    }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: sans-serif; }
    header.doc { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--line); }
    .theme-toggle { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 999px; width: 32px; height: 32px; cursor: pointer; }
  </style>
</head>
<body>
  <header class="doc">
    <h1>Fixture B-T3 — aucune persistance localStorage</h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Bascule thème sombre"></button>
  </header>
  <main><p>Le choix de thème n'est jamais écrit ni relu depuis localStorage : il se perd au rechargement.</p></main>
  <script>
    (function () {
      var bouton = document.getElementById('theme-toggle');
      var racine = document.documentElement;
      bouton.addEventListener('click', function () {
        racine.setAttribute('data-theme', racine.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
</body>
</html>
