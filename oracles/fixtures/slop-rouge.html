<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fixture rouge — oracle-slop</title>
<!-- provenance : chantier forge-design, 04/08/2026. Déclenche S1 à S10. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap">
<style>
  /* S3 · police réflexe */
  body { font-family: 'Inter', sans-serif; background: #000; color: #fff; }

  /* S1 · bandeau latéral coloré */
  .alerte { border-left: 4px solid var(--color-warning); padding: 12px; }
  .encart { border-right: 3px solid #e11d48; }

  /* S2 + S5a · texte en dégradé, violet vers bleu */
  .titre {
    background: linear-gradient(90deg, #7c3aed, #2563eb);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* S5b · accent néon sur fond sombre */
  .accent { color: #00ffcc; }

  /* S8 · easing daté */
  .carte { transition: transform .3s cubic-bezier(.68, -.55, .27, 1.55); }
  .pastille { animation: bounce 1s infinite; }

  /* S9 · rayon uniforme + ombre noire non teintée */
  .carte { border-radius: 12px; box-shadow: 0 4px 12px rgba(0, 0, 0, .18); }
  .champ { border-radius: 12px; }
  .bouton { border-radius: 12px; }
</style>
</head>
<body>
  <h1 class="titre">Tableau de bord</h1>

  <!-- S6 · emoji en production -->
  <p>Bienvenue 🚀 sur votre espace <span class="accent">temps réel</span></p>

  <div class="alerte">Quota bientôt atteint.</div>
  <div class="encart">Note de version.</div>

  <!-- S7 · trois cartes de structure identique -->
  <section class="grille">
    <div class="carte"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg><h3>Rapide</h3><p>Traitement immédiat.</p></div>
    <div class="carte"><svg viewBox="0 0 24 24"><path d="M12 2l10 20H2z"/></svg><h3>Fiable</h3><p>Disponibilité tenue.</p></div>
    <div class="carte"><svg viewBox="0 0 24 24"><path d="M2 12h20"/></svg><h3>Ouvert</h3><p>Interfaces documentées.</p></div>
  </section>

  <!-- S10 · sparkline décoratif : ni axe, ni légende, ni libellé -->
  <div class="pastille">
    <svg viewBox="0 0 120 40"><polyline points="0,30 20,22 40,26 60,12 80,18 100,6 120,10" fill="none" stroke="#00ffcc"/></svg>
  </div>
</body>
</html>
