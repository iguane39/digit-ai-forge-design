<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1">
<title>Fixture rouge — oracle-mobile</title>
<!-- provenance : chantier forge-design, 04/08/2026. Déclenche M1 à M7.
     M7 (TF-0875, 08/09/2026) : le panier du 06/09 en une page — un formulaire rendu par le
     serveur, une barre basse qui navigue vers d'autres documents, et AUCUN support de survie.
     La quantité 2 est perdue au premier aller-retour Aide → La carte. -->
<style>
  /* M2 · cibles tactiles sous 44 px */
  .btn { height: 32px; min-width: 28px; }
  a.lien { min-height: 24px; }

  /* M3 · barre fixe collée au bord, sans safe-area */
  .barre-basse { position: fixed; bottom: 0; left: 0; right: 0; }

  /* M5 · plein écran sans traitement du paysage */
  .ecran { height: 100vh; }

  /* M6 · mouvement sans échappatoire */
  .carte { transition: transform .3s ease-out; }
  @keyframes pulse { from { opacity: .6 } to { opacity: 1 } }

  /* M4 · aucune règle de reflow sous 768 px, et masquage de colonnes */
  @media (max-width: 600px) {
    td.secondaire { display: none; }
  }
</style>
</head>
<body>
  <div class="ecran">
    <button class="btn">Filtrer</button>
    <a class="lien" href="#detail">Détail</a>

    <form id="panier" action="/panier" method="post">
      <label for="qte">Quantité</label>
      <input class="champ" id="qte" name="qte" type="number" min="0" value="2">
    </form>

    <table>
      <thead><tr><th>Dossier</th><th class="secondaire">Ouvert le</th><th>Statut</th></tr></thead>
      <tbody>
        <tr><td>D-1042</td><td class="secondaire">02/07/2026</td><td>En cours</td></tr>
        <tr><td>D-1043</td><td class="secondaire">03/07/2026</td><td>Clos</td></tr>
      </tbody>
    </table>
  </div>
  <nav class="barre-basse">
    <a class="lien" href="aide.html">Aide</a>
    <a class="lien" href="carte.html">La carte</a>
    <a class="lien" href="profil.html">Profil</a>
  </nav>
</body>
</html>
