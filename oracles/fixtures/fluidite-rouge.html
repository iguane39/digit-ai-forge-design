<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visite 3D lente — fixture rouge d'oracle-fluidite (D-108 (b))</title>
<!--
  Fixture ROUGE de oracle-fluidite : la page du 27/10 en réduction. Un canevas WebGL animé dont le
  travail graphique par image est COÛTEUX (shader de fragment à 512 tours de boucle, répété sur
  plusieurs passes plein canevas). La boucle JavaScript, elle, ne coûte rien : elle pose deux uniformes
  et lance les dessins, puis rend la main. Le navigateur rappelle donc l'animation à 60 Hz pendant que la
  carte, derrière, termine une image toutes les ~150 ms. Un compteur de rappels annonce 60 i/s ; la durée
  d'image de bout en bout est de l'ordre de 7 i/s (mesuré le 29/10/2026 sur rendu logiciel, moteur par
  défaut de Chromium, en début de séance). LE PIÈGE N'EST PAS DÉTERMINISTE : plus tard le même jour, sur le
  même poste sous forte charge, le compteur de rappels est retombé à 4,7–6,6 i/s (moteur forcé comme moteur
  par défaut) — le navigateur freine parfois les rappels quand la carte est en retard. La recette le dit
  quand le témoin ne trompe pas, au lieu de le prétendre ; la mesure de bout en bout, elle, ne varie pas.

  LE COÛT S'ÉTALONNE SUR LE POSTE, pour que la fixture soit lente quelle que soit la machine qui joue la
  recette. Pendant les premières images, la page double le nombre de passes jusqu'à ce qu'une image
  attende au moins 120 ms la fin du travail graphique (lecture d'un pixel : gl.finish() seul ne bloque
  pas sous Chromium), puis elle cesse toute attente : en régime, elle se comporte comme la page fautive
  (aucune synchronisation de sa part). Sur un processeur graphique rapide, le nombre de passes monte ;
  sur un rendu logiciel, il reste très bas (4 passes au poste de rédaction : 51, 69 puis 143 ms pour
  1, 2 puis 4 passes). Plafond : 8192 passes.
-->
<style>
  html, body { margin: 0; background: #11161c; color: #e8edf2; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 16px; }
  canvas { display: block; width: 100%; max-width: 960px; height: auto; background: #000; }
</style>
</head>
<body>
<main>
  <h1>Visite 3D</h1>
  <canvas id="scene" width="960" height="540" aria-label="Scène animée"></canvas>
</main>
<script>
(function () {
  var canevas = document.getElementById('scene');
  var gl = canevas.getContext('webgl');
  if (!gl) { document.body.insertAdjacentHTML('beforeend', '<p>WebGL indisponible</p>'); return; }
  var vs = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
  var fs = 'precision highp float; uniform float t; uniform vec2 res;'
    + 'void main() { vec2 uv = gl_FragCoord.xy / res; float a = 0.0;'
    + 'for (int i = 0; i < 512; i++) { a += sin(uv.x * float(i) + t) * cos(uv.y * float(i) - t) / float(i + 1); }'
    + 'gl_FragColor = vec4(0.5 + 0.5 * sin(a), uv.y, 0.5 + 0.5 * cos(a), 1.0); }';
  function shader(type, source) { var s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s); return s; }
  var prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  var tampon = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, tampon);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var p = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
  var ut = gl.getUniformLocation(prog, 't'); gl.uniform2f(gl.getUniformLocation(prog, 'res'), canevas.width, canevas.height);

  var passes = 1, etalonne = false, pixel = new Uint8Array(4);
  function image(ts) {
    gl.uniform1f(ut, ts / 1000);
    if (!etalonne) {
      var debut = performance.now();
      for (var k = 0; k < passes; k++) gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      if (performance.now() - debut >= 120 || passes >= 8192) etalonne = true; else passes *= 2;
    } else {
      for (var j = 0; j < passes; j++) gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    requestAnimationFrame(image);
  }
  requestAnimationFrame(image);
})();
</script>
</body>
</html>
