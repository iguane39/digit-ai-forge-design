<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixture verte — page au socle digit-ai : charte declaree et repli en cartes prescrit</title>
<!-- TF-0857 (constat du 04/09/2026, arbitre le 08/09). Cette page porte les DEUX points ou les
     oracles de cette forge contredisaient le socle digit-ai qu'ils jugent :

     1) S3 bannit « DM Sans » comme police reflexe, alors que la charte du socle l'EXIGE en
        police de corps et que le propre controle du socle le verifie. La page DECLARE la charte
        en liant les deux jetons du socle (--head vers Roboto, --sans vers DM Sans) : l'exemption
        se merite a cette declaration, et elle ne porte que sur ces deux familles-la.

     2) M4 condamnait « colonnes masquees en mobile » sur le thead masque par le REPLI EN CARTES,
        qui est le motif prescrit par le socle : sous le seuil, le thead disparait et chaque
        cellule reprend son etiquette par td::before { content: attr(data-label) }. Rien n'est
        ampute — l'en-tete change de place.

     Un oracle qui refuse ce que le socle qu'il juge PRESCRIT rend « Refondre » par construction,
     et le verdict cesse d'etre un defaut du produit pour devenir un desaccord entre juges. -->
<style>
  /* Les deux jetons de charte du socle : c'est CETTE declaration qui vaut reconnaissance. */
  :root { --head: "Roboto", system-ui, sans-serif; --sans: "DM Sans", system-ui, sans-serif; }
  body { font-family: "DM Sans", system-ui, sans-serif; margin: 0; padding: 16px; }
  h1, h2 { font-family: "Roboto", system-ui, sans-serif; }

  .btn { min-height: 44px; min-width: 44px; padding: 12px 16px; }
  a.lien { min-height: 44px; display: inline-flex; align-items: center; }

  .barre-basse {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }

  .ecran { min-height: 100dvh; display: flex; flex-direction: column; }
  .contenu { flex: 1; min-height: 0; overflow-y: auto; }

  :root { --dur-normale: 280ms; --ease-sortie: cubic-bezier(.16, 1, .3, 1); }
  .carte { transition: transform var(--dur-normale) var(--ease-sortie); }

  /* Le repli en cartes PRESCRIT par le socle (composants.md §6) : le thead disparait, et
     chaque cellule reprend son etiquette. C'est un deplacement de l'en-tete, pas une coupe. */
  @media (max-width: 768px) {
    table, tbody, tr, td { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid; margin-bottom: 12px; }
    td::before { content: attr(data-label); font-weight: 600; }
  }

  @media (orientation: landscape) and (max-height: 480px) {
    .barre-basse { position: static; }
    .ecran { min-height: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="ecran">
    <h1>Dossiers ouverts</h1>
    <button class="btn">Filtrer</button>
    <a class="lien" href="#detail">Detail</a>

    <form id="panier">
      <label for="qte">Quantite</label>
      <input class="champ" id="qte" name="qte" type="number" min="0" value="2">
    </form>

    <table>
      <thead><tr><th>Dossier</th><th>Ouvert le</th><th>Statut</th></tr></thead>
      <tbody>
        <tr><td data-label="Dossier">D-1042</td><td data-label="Ouvert le">02/07/2026</td><td data-label="Statut">En cours</td></tr>
        <tr><td data-label="Dossier">D-1043</td><td data-label="Ouvert le">03/07/2026</td><td data-label="Statut">Clos</td></tr>
      </tbody>
    </table>
  </div>
  <nav class="barre-basse">
    <a class="lien" href="accueil.html">Accueil</a>
    <a class="lien" href="dossiers.html">Dossiers</a>
    <a class="lien" href="profil.html">Profil</a>
  </nav>
  <script>
    var champ = document.getElementById('qte');
    var garde = sessionStorage.getItem('panier.qte');
    if (garde !== null) champ.value = garde;
    champ.addEventListener('input', function () { sessionStorage.setItem('panier.qte', champ.value); });
  </script>
</body>
</html>
