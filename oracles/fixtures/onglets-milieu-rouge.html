<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture rouge — onglets sous le premier écran, simples liens vers des pages sœurs</title>
<!--
  TF-1916, le cas réel du 18/10/2026. Même page que onglets-milieu-verte.html (même bandeau de
  plus d'un écran, mêmes onglets sous lui, même calendrier en dessous) ; une seule chose change :
  les onglets sont de simples liens vers des pages sœurs (onglets-milieu-rouge-b.html), sans
  script. Chaque clic recharge la page et la ramène en haut : le lecteur qui comparait les gîtes
  perd sa place.
-->
<style>
  :root { color-scheme: light; --fond: #fbf9f5; --texte: #1d2126; --trait: #d8d2c6; --accent: #27496d; }
  body { background: var(--fond); color: var(--texte); font-family: Georgia, serif; margin: 0; }
  .bandeau { height: 1400px; padding: 32px; border-bottom: 1px solid var(--trait); }
  .onglets { display: flex; gap: 8px; padding: 12px 32px; border-bottom: 1px solid var(--trait); }
  .onglets a { padding: 8px 16px; border: 1px solid var(--trait); color: var(--texte); text-decoration: none; }
  .onglets a[aria-selected="true"] { background: var(--accent); color: #ffffff; }
  .calendrier { min-height: 1600px; padding: 32px; }
</style>
</head>
<body>
  <header class="bandeau"><h1>Réservation</h1><p>Choisissez un gîte puis une période.</p></header>
  <nav class="onglets" role="tablist" aria-label="Gîtes">
    <a role="tab" href="onglets-milieu-rouge.html" aria-selected="true">Gîte A</a>
    <a role="tab" href="onglets-milieu-rouge-b.html" aria-selected="false">Gîte B</a>
    <a role="tab" href="onglets-milieu-rouge-b.html" aria-selected="false">Gîte C</a>
  </nav>
  <main class="calendrier" id="calendrier" role="tabpanel"><h2>Calendrier du gîte A</h2><p>Disponibilités du gîte A.</p></main>
</body>
</html>
